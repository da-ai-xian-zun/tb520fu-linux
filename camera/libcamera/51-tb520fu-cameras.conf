# TB520FU: distinct names for the three cameras (two are both "back").
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "libcamera_input._base_soc_0_cci_ac15000_i2c-bus_0_camera_11" } ]
    actions = { update-props = { node.description = "后置主摄", node.nick = "后置主摄" } }
  }
  {
    matches = [ { node.name = "libcamera_input._base_soc_0_cci_ac15000_i2c-bus_1_camera_36" } ]
    actions = { update-props = { node.description = "后置微距", node.nick = "后置微距" } }
  }
  {
    matches = [ { node.name = "libcamera_input._base_soc_0_cci_ac16000_i2c-bus_0_camera_39" } ]
    actions = { update-props = { node.description = "前置摄像头", node.nick = "前置摄像头" } }
  }
]
