# SPDX-License-Identifier: CC0-1.0
# TB520FU rear camera (GalaxyCore GC13A0 + DW9768 VCM), libcamera softisp >= 0.8.
# CCMs: colour correction matrices parsed from the Android tuning file
# com.qti.tuned.lapis_lce_gc13a0.bin, blended 50 % with identity (full
# strength amplifies residual white-balance error into magenta shadows).
# White-balance bias folded into the CCMs: R x0.975, B x1.05 (the softisp
# grey-world AWB has no bias knob; CCM x diag(r, 1, b) is equivalent).
# Calibrated 2026-11-18 against white paper (R/G 1.004, B/G 1.003) and the
# Android reference shot taken with the stock camera.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096          # 64 at 10 bit (GalaxyCore); 2800 left the shadows grey
  - Awb:
  - Ccm:
      ccms:
        - ct: 3000
          ccm: [ 1.2383, -0.36, 0.0945,
                 -0.1009, 1.0585, 0.0473,
                 0, -0.585, 1.6643 ]
        - ct: 4000
          ccm: [ 1.3231, -0.238, -0.125,
                 -0.087, 1.1339, -0.0468,
                 0.0101, -0.2677, 1.3202 ]
        - ct: 5000
          ccm: [ 1.2266, -0.3096, 0.0542,
                 -0.0838, 1.1654, -0.0835,
                 0.0067, -0.3509, 1.4112 ]
        - ct: 6500
          ccm: [ 1.2309, -0.2, -0.0656,
                 -0.0366, 1.1125, -0.0788,
                 0.0195, -0.175, 1.2127 ]
  - Adjust:
      gamma: 2.2
      contrast: 1.25
      saturation: 1.3
  - Agc:
      # Upper bound only: libipa's default lower bound (top 2 % >= 0.5) drove the
      # gain to 8x and overexposed every indoor scene on this softisp pipeline.
      AeConstraintMode:
        Normal:
          upper:
            qLo: 0.98
            qHi: 1.0
            yTarget: 0.8
      relativeLuminanceTarget: 0.12
...
