# TB520FU speaker protection, stage 1 (no Android smart-PA protection on Linux): a 2nd-order
# high-pass at 200 Hz in front of the built-in speakers. The micro speakers cannot reproduce that
# range anyway; it is what drives the cone furthest. WirePlumber inserts this "smart filter" only
# into streams that go to the speaker sink, so Bluetooth and USB audio are untouched and the
# speaker sink stays the default device. Loaded by the user's filter-chain.service.
# The filter's own volume must stay at 1.0 (all volume control is on the speaker sink), so
# WirePlumber is told not to save/restore it: a saved 8% (0.000512 linear) once made every
# app routed through the filter, e.g. Firefox, practically silent (2026-11-16).
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "扬声器保护"
      media.name       = "扬声器保护"
      filter.graph = {
        nodes = [
          { type = builtin name = hpl label = bq_highpass control = { "Freq" = 200.0 "Q" = 0.707 } }
          { type = builtin name = hpr label = bq_highpass control = { "Freq" = 200.0 "Q" = 0.707 } }
        ]
        inputs  = [ "hpl:In" "hpr:In" ]
        outputs = [ "hpl:Out" "hpr:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "tb520fu.speaker-protect"
        media.class = Audio/Sink
        filter.smart = true
        filter.smart.name = "tb520fu.speaker-protect"
        filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
        state.restore-props = false
      }
      playback.props = {
        node.name    = "tb520fu.speaker-protect.out"
        node.passive = true
        state.restore-props = false
      }
    }
  }
]
