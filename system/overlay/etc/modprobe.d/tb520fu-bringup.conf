# First Debian boots: keep firmware-dependent subsystems out of the way, so a
# failure points at one thing. Remove lines one at a time as each is brought up.
blacklist qcom_q6v5_adsp
blacklist qcom_q6v5_mss
# blacklist pmic_glink_altmode   (mdss28: DP and the internal panel need it)
# blacklist ucsi_glink            (mdss28: USB-C role switching)
blacklist fastrpc
blacklist venus_core
