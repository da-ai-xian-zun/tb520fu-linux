# TB520FU: the built-in speakers never get software gain above 0 dB (no "over 100%"),
# whatever an application asks for. Stage 1 of speaker protection, see the filter-chain high-pass.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = { update-props = { channelmix.max-volume = 1.0 } }
  }
]
