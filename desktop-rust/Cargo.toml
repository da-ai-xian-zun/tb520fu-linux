[workspace]
resolver = "2"
members = [
    "crates/tb520fu-ui",
    "crates/tb520fu-daemon",
    "crates/tb520fu-osk",
    "crates/tb520fu-shell",
    "crates/tb520fu-sys",
    "crates/tb520fu-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TB520FU Linux Project"]

[workspace.dependencies]
libc = "0.2"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
tiny-skia = "0.11"
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash", "fontconfig"] }
svgtypes = "0.15"
png = "0.17"
zune-jpeg = "0.4"
unicode-segmentation = "1.12"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
