[env]
PKG_CONFIG_ALLOW_CROSS = "1"
PKG_CONFIG_PATH = { value = "scripts/arm64-libs/pkgconfig", relative = true }

[target.x86_64-unknown-linux-gnu]
linker = "scripts/x86_64-linker.sh"

[target.aarch64-unknown-linux-gnu]
linker = "scripts/aarch64-linker.sh"
rustflags = ["-C", "target-feature=+neon,+dotprod,+fp16"]
