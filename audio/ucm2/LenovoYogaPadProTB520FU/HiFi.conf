SectionDevice."Mic" {
	Comment "Internal Microphones"

	ConflictingDevice [
		"Headset"
	]

	# AMIC1 -> ADC1 and AMIC4 -> ADC3, as the vendor "primary-mic" and
	# "secondary-mic" paths. The ADCs arrive on the first SoundWire input
	# port of the TX macro: ADC1 is SWR_MIC0 and ADC3 is SWR_MIC2 (verified
	# with a test tone). The vendor names SWR_MIC4/SWR_MIC8 belong to its
	# own port assignment and do not apply here.
	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1 MUX' 'CH1_AMIC1'"
		cset "name='ADC3 MUX' 'CH3_AMIC4'"
		cset "name='TX0 MODE' 'ADC_NORMAL'"
		cset "name='TX2 MODE' 'ADC_NORMAL'"
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'SWR_MIC0'"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC1 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX1' 'SWR_MIC2'"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC3 Switch' 1"
		# The analog gain is what Android uses. Android then amplifies in
		# software; here the decimator adds 12 dB (1 dB per step, 84 = 0 dB)
		# so that normal speech peaks near -9 dBFS instead of -21 dBFS.
		# Raising the ADC gain instead gives the same noise floor (measured)
		# and less headroom.
		cset "name='ADC1 Volume' 12"
		cset "name='ADC3 Volume' 12"
		cset "name='TX_DEC0 Volume' 96"
		cset "name='TX_DEC1 Volume' 96"
	]

	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' 'ZERO'"
		cset "name='TX SMIC MUX1' 'ZERO'"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}

# Untested: no wired headset was available. AMIC2 -> ADC2 is SWR_MIC1.
SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC2 MUX' 'CH2_AMIC2'"
		cset "name='TX1 MODE' 'ADC_NORMAL'"
		cset "name='TX DEC0 MUX' 'SWR_MIC'"
		cset "name='TX SMIC MUX0' 'SWR_MIC1'"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 12"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' 'ZERO'"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		JackControl "Mic Jack"
	}
}
